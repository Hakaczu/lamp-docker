server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Default: route root to PHP 8.2
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass php82:9000;
    }

    # /php81/* served by PHP 8.1
    location /php81/ {
        alias /var/www/html/php81/;
        index index.php index.html;
        try_files $uri $uri/ /php81/index.php?$query_string;
    }

    location ~ ^/php81/(.+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/php81/$1;
        fastcgi_param SCRIPT_NAME /$1;
        fastcgi_pass php81:9000;
    }

    # /php82/* explicitly to PHP 8.2
    location /php82/ {
        alias /var/www/html/php82/;
        index index.php index.html;
        try_files $uri $uri/ /php82/index.php?$query_string;
    }

    location ~ ^/php82/(.+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/php82/$1;
        fastcgi_param SCRIPT_NAME /$1;
        fastcgi_pass php82:9000;
    }
}
